[package]
name = "atmos-ui"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "The Atmos window, built on ODK"
license = "MIT"

# Its own Cargo root: it must not attach to a parent workspace, and `backend/` is a separate one.
[workspace]

[dependencies]
odk = { path = "../../odk/crates/odk" }
async-channel = "2"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
odk = { path = "../../odk/crates/odk", features = ["test-support"] }

# Profiles and patches are read from the root manifest only (see odk's Cargo.toml).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
xattr = { path = "../../odk/patches/xattr" }
# ODK patches gpui 0.2.2 so truncated text keeps its font (its ADR 0079).
gpui = { path = "../../odk/patches/gpui" }
